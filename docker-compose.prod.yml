services:
  corecreator:
    container_name: corecreator_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
    # Bound to loopback, NOT 0.0.0.0. Published as "3002:3000" the app was
    # reachable at http://<vps-ip>:3002 over plain HTTP - the whole site,
    # including the login forms, served without TLS and bypassing nginx
    # entirely. Sending a Host header of admin.corecreator.online to that port
    # reached the admin portal over cleartext. nginx is the only public
    # entrance now; it proxies to 127.0.0.1:3002 on the host, which still works.
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.production
    # Surfaces real health in `docker ps` rather than just "is the process
    # alive" - /api/health returns 503 if the app can't reach MongoDB.
    # wget is busybox-provided in the node:20-alpine base image.
    #
    # 127.0.0.1, NOT localhost: inside the container localhost resolves to the
    # IPv6 loopback ::1 first, and the server does not listen there.
    #
    # That alone did not fix it. The server binds to process.env.HOSTNAME, which
    # Docker sets to the container ID, so it was listening only on the
    # container's own eth0 address and not on loopback at all. See ENV HOSTNAME
    # in the Dockerfile - without that line this check fails whatever address it
    # is pointed at.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - corecreator_network

networks:
  corecreator_network:
    driver: bridge
